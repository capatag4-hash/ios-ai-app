<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aura Engine</title>
    <style>
        /* --- NATIVE APP DESIGN SYSTEM --- */
        :root {
            --bg: #131314;
            --surface: #1e1f20;
            --surface-variant: #282a2c;
            --border: #3c4043;
            --accent: #1a73e8;
            --accent-glow: rgba(26, 115, 232, 0.15);
            --text-main: #e3e3e3;
            --text-sub: #9aa0a6;
            --text-bright: #ffffff;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface-variant: #e4e6eb;
            --border: #cbd5e1;
            --accent: #1a73e8;
            --accent-glow: rgba(26, 115, 232, 0.1);
            --text-main: #1c1e21;
            --text-sub: #65676b;
            --text-bright: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
            transition: background 0.3s var(--ease), color 0.3s var(--ease);
        }

        /* --- STAGE MANAGEMENT LAYER --- */
        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            background: var(--bg);
            transition: opacity 0.25s var(--ease), visibility 0.25s;
        }

        .stage.hidden {
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        /* CARD AND ACCESS INTERFACES */
        #login-stage {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 32px 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-bright);
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .clean-input {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            color: var(--text-bright);
            font-size: 1rem;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .clean-input:focus {
            border-color: var(--accent);
        }

        .prime-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .prime-btn:active {
            background: #1557b0;
        }

        .bypass-action {
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }

        /* --- SLIDE DRAWER SETTINGS PANEL --- */
        #side-panel {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 100;
            padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 24px) 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #side-panel.open {
            left: 0;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-row {
            background: var(--surface-variant);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Avatar Element Setup */
        .avatar-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pfp-viewport {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            overflow: hidden;
        }

        .pfp-viewport img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #pfp-settings-row {
            display: none;
        }

        #pfp-settings-row.visible {
            display: flex;
        }

        /* Custom Toggle Modules */
        .toggle-input { display: none; }
        .toggle-track {
            width: 44px; height: 24px; background: #3c4043; border-radius: 12px;
            position: relative; cursor: pointer; transition: background 0.2s;
        }
        .toggle-track::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; background: #9aa0a6; border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }
        .toggle-input:checked + .toggle-track { background: var(--accent); }
        .toggle-input:checked + .toggle-track::after { transform: translateX(20px); background: #fff; }
        .toggle-input:disabled + .toggle-track { opacity: 0.25; cursor: not-allowed; }

        /* Hidden Inner Segment Block */
        .sub-tier-cluster {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .sub-tier-cluster.active {
            display: flex;
        }

        /* --- APP CONTENT CONTAINER --- */
        #workspace-stage {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
