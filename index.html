<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aura Engine</title>
    <style>
        /* --- MODERN PREMIUM DARK VARIABLE MATRIX --- */
        :root {
            --bg: #131314;
            --surface: #1e1f20;
            --surface-variant: #282a2c;
            --border: #3c4043;
            --accent: #1a73e8;
            --accent-glow: rgba(26, 115, 232, 0.15);
            --text-main: #e3e3e3;
            --text-sub: #9aa0a6;
            --text-bright: #ffffff;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* --- STAGE MODAL GATEWAYS --- */
        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            background: var(--bg);
            transition: opacity 0.25s ease, visibility 0.25s;
        }

        .stage.hidden {
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        /* --- AUTHENTICATION CARDS --- */
        #login-stage {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 32px 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-bright);
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .clean-input {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            color: var(--text-bright);
            font-size: 1rem;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .clean-input:focus {
            border-color: var(--accent);
        }

        .prime-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .prime-btn:active {
            background: #1557b0;
        }

        .bypass-action {
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }

        /* --- NAVIGATION OPTIONS PANEL --- */
        #side-panel {
            position: absolute;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 100;
            padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 24px) 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #side-panel.open {
            left: 0;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-row {
            background: var(--surface-variant);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- DASHBOARD HEADERS --- */
        #workspace-stage {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #scrim {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 90;
        }

        #scrim.active {
            display: block;
        }

        header {
            padding: calc(var(--safe-top) + 14px) 20px 14px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-toggle {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-bright);
        }

        .tier-badge {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
        }

        .tier-badge.premium {
            border-color: rgba(26, 115, 232, 0.4);
            background: var(--accent-glow);
            color: #8ab4f8;
        }

        /* --- CONVERSATION CANVAS --- */
        #chat-canvas {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--bg);
        }

        .msg-bubble {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .msg-bubble.user {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-bright);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.ai {
            background-color: transparent;
            color: var(--text-main);
            align-self: flex-start;
            padding-left: 0;
            max-width: 100%;
        }

        /* --- DOCK CONTROL BAR --- */
        #control-dock {
            padding: 12px 20px calc(var(--safe-bottom) + 16px) 20px;
            background: var(--bg);
            display: flex;
            gap: 12px;
        }

        .pill-wrapper {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 4px 6px 4px 18px;
        }

        .pill-wrapper:focus-within {
            border-color: var(--border);
            background: var(--surface-variant);
        }

        #msg-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-bright);
            font-size: 1rem;
            outline: none;
            padding: 10px 0;
        }

        #send-btn {
            background: var(--accent);
            border: none;
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        /* Standard Toggle Switches */
        .toggle-input { display: none; }
        .toggle-track {
            width: 44px; height: 24px; background: #3c4043; border-radius: 12px;
            position: relative; cursor: pointer; transition: background 0.2s;
        }
        .toggle-track::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; background: #9aa0a6; border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }
        .toggle-input:checked + .toggle-track { background: var(--accent); }
        .toggle-input:checked + .toggle-track::after { transform: translateX(20px); background: #fff; }
        .toggle-input:disabled + .toggle-track { opacity: 0.25; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="scrim" onclick="toggleSidePanel()"></div>

    <div id="login-stage" class="stage">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Sign in to Aura</h1>
                <p>Enter an operator username to connect</p>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username-field" class="clean-input" placeholder="e.g. Alex" autocomplete="off">
            </div>
            <button class="prime-btn" onclick="authenticateSession()">Continue</button>
            <div class="bypass-action" onclick="bypassAsGuest()">Use without an account</div>
        </div>
    </div>

    <div id="side-panel">
        <div class="panel-section">
            <span class="panel-label">Account details</span>
            <div class="panel-row">
                <span id="panel-username-display" style="font-weight: 500;">Guest Session</span>
            </div>
            <button class="prime-btn" style="padding: 10px; font-size: 0.9rem; background: var(--surface-variant); border: 1px solid var(--border); color: var(--text-main);" onclick="signoutSession()">Sign Out</button>
        </div>
        
        <div class="panel-section">
            <span class="panel-label">Usage status</span>
            <div class="panel-row">
                <span>Message Allocation:</span>
                <span id="panel-allocation-display" style="font-weight: 500; color: var(--accent);">15 / 15 min</span>
            </div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Settings</span>
            <div class="panel-row">
                <span>Experimental Toggles:</span>
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" id="experimental-toggle" class="toggle-input">
                    <label for="experimental-toggle" class="toggle-track"></label>
                </div>
            </div>
        </div>
    </div>

    <div id="workspace-stage" class="stage hidden">
        <header>
            <button class="panel-toggle" onclick="toggleSidePanel()">☰</button>
            <div class="brand-title">Aura</div>
            <div id="tier-badge" class="tier-badge">Guest</div>
        </header>

        <div id="chat-canvas">
            <div class="msg-bubble ai">Hello! I'm Aura. How can I help you today?</div>
        </div>

        <div id="control-dock">
            <div class="pill-wrapper">
                <input type="text" id="msg-input" placeholder="Message Aura..." autocomplete="off" onkeypress="handleInputKey(event)">
                <button id="send-btn" onclick="executePayloadTransmission()">➔</button>
            </div>
        </div>
    </div>

    <script>
        // 🔴 PASTE YOUR ACTUAL GEMINI API KEY HERE 🔴
        const NATIVE_IOS_KEY = "AIzaSyBlLECBL_7bT3X8j2NM3PyTNOvXQ7FTkso";

        // APP WORKSPACE TRACKING VARIABLES
        let activeProfile = null;
        let messageHistoryTimestamps = [];
        const TRANSACTION_MAX = 15;
        const RESYNC_WINDOW_MS = 15 * 60 * 1000;

        // TARGET DOCUMENT DOM REFS
        const loginStage = document.getElementById('login-stage');
        const workspaceStage = document.getElementById('workspace-stage');
        const sidePanel = document.getElementById('side-panel');
        const scrim = document.getElementById('scrim');
        const chatCanvas = document.getElementById('chat-canvas');
        const msgInput = document.getElementById('msg-input');
        const usernameField = document.getElementById('username-field');
        const tierBadge = document.getElementById('tier-badge');
        const panelUsernameDisplay = document.getElementById('panel-username-display');
        const panelAllocationDisplay = document.getElementById('panel-allocation-display');
        const experimentalToggle = document.getElementById('experimental-toggle');

        function toggleSidePanel() {
            sidePanel.classList.toggle('open');
            scrim.classList.toggle('active');
        }

        // PARSE USER SIGN IN
        function authenticateSession() {
            const rawUserText = usernameField.value.trim();
            if(!rawUserText) {
                alert("Please enter a valid username to continue.");
                return;
            }

            activeProfile = rawUserText;
            
            // Adjust configuration privileges for Signed-In Accounts
            tierBadge.innerText = "Premium";
            tierBadge.classList.add('premium');
            panelUsernameDisplay.innerText = activeProfile;
            panelAllocationDisplay.innerText = "Infinite";
            experimentalToggle.disabled = false;

            // Transition screens
            loginStage.classList.add('hidden');
            workspaceStage.classList.remove('hidden');
        }

        // PARSE GUEST ENTRY
        function bypassAsGuest() {
            activeProfile = null;
            
            // Enforce restricted limits for Guest profile configurations
            tierBadge.innerText = "Guest";
            tierBadge.classList.remove('premium');
            panelUsernameDisplay.innerText = "Guest Session";
            panelAllocationDisplay.innerText = "15 / 15 min";
            experimentalToggle.checked = false;
            experimentalToggle.disabled = true;

            loginStage.classList.add('hidden');
            workspaceStage.classList.remove('hidden');
        }

        // TERMINATE CURRENT CONTEXT MODE
        function signoutSession() {
            usernameField.value = '';
            messageHistoryTimestamps = [];
            toggleSidePanel();
            workspaceStage.classList.add('hidden');
            loginStage.classList.remove('hidden');
        }

        function handleInputKey(e) {
            if (e.key === 'Enter') executePayloadTransmission();
        }

        // VALIDATE COMPLIANCE TRACKERS
        function calculateAllocationCompliance() {
            if (activeProfile !== null) return { allowed: true };

            const timestampMark = Date.now();
            messageHistoryTimestamps = messageHistoryTimestamps.filter(t => (timestampMark - t) < RESYNC_WINDOW_MS);

            if (messageHistoryTimestamps.length >= TRANSACTION_MAX) {
                const earliestRemainingTime = messageHistoryTimestamps[0];
                const deltaCalculated = RESYNC_WINDOW_MS - (timestampMark - earliestRemainingTime);
                return { allowed: false, retryMinutes: Math.ceil(deltaCalculated / 60000) };
            }
            return { allowed: true };
        }

        // DISPATCH SECURE PIPELINE NETWORK INSTRUCTIONS
        async function executePayloadTransmission() {
            const inputQuery = msgInput.value.trim();
            if (!inputQuery) return;

            const trackingStatus = calculateAllocationCompliance();
            if(!trackingStatus.allowed) {
                alert(`Account limit reached. Guest profiles are restricted to 15 messages every 15 minutes. Sign in to unlock unlimited messages, or try again in ${trackingStatus.retryMinutes} minutes.`);
                return;
            }

            if (NATIVE_IOS_KEY === "PASTE_YOUR_GEMINI_API_KEY_HERE" || !NATIVE_IOS_KEY) {
                alert("App configuration incomplete. API key required.");
                return;
            }

            if (activeProfile === null) {
                messageHistoryTimestamps.push(Date.now());
            }

            renderBubble(inputQuery, 'user');
            msgInput.value = '';

            const aiBubbleNode = renderBubble("Thinking...", 'ai');

            try {
                const streamingGateway = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:streamGenerateContent?key=${NATIVE_IOS_KEY}`;
                const networkConnection = await fetch(streamingGateway, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: inputQuery }] }] })
                });

                if (!networkConnection.ok) throw new Error();

                const reader = networkConnection.body.getReader();
                const textDecoder = new TextDecoder();
                let continuousBufferText = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const segmentChunk = textDecoder.decode(value, { stream: true });
                    const arrayBlocks = segmentChunk.split('\n');

                    for (const arrayRow of arrayBlocks) {
                        if (arrayRow.trim().startsWith('"text":')) {
                            const parsedTokenString = arrayRow.split('"text":')[1].trim().replace(/^"|",?$/g, '');
                            continuousBufferText += parsedTokenString.replace(/\\n/g, '\n').replace(/\\"/g, '"');
                            aiBubbleNode.innerText = continuousBufferText;
                            chatCanvas.scrollTop = chatCanvas.scrollHeight;
                        }
                    }
                }

                if (!continuousBufferText) {
                    aiBubbleNode.innerText = "Received empty validation context structure from processing endpoint.";
                }

            } catch (err) {
                aiBubbleNode.innerText = "Connection failed. Please check your network and API endpoint configurations.";
            }
        }

        function renderBubble(messageContent, bubbleClass) {
            const nodeElement = document.createElement('div');
            nodeElement.className = `msg-bubble ${bubbleClass}`;
            nodeElement.innerText = messageContent;
            chatCanvas.appendChild(nodeElement);
            chatCanvas.scrollTop = chatCanvas.scrollHeight;
            return nodeElement;
        }
    </script>
</body>
</html>
