<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aura iOS</title>
    
    <!-- Apple Web App Native Execution Directives -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #2f80ed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: #070814;
            background-image: radial-gradient(circle at 50% 10%, #17193b 0%, #070814 70%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 55px 20px 16px 20px; /* Safe space allowance for dynamic island / notch screens */
            background: rgba(7, 8, 20, 0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { font-weight: 700; font-size: 19px; letter-spacing: -0.3px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4cd964; box-shadow: 0 0 8px #4cd964; }

        #chat-canvas { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; max-width: 80%; line-height: 1.4; word-wrap: break-word; animation: bubblePop 0.25s cubic-bezier(0.1, 0.8, 0.2, 1); }
        .bubble.user { background: linear-gradient(135deg, #007aff, #0056b3); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bubble.aura { background: var(--glass); border: 0.5px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        .input-dock-container { padding: 12px 16px 34px 16px; background: rgba(7, 8, 20, 0.3); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); }
        .liquid-tray { display: flex; gap: 10px; background: var(--glass); border: 0.5px solid var(--border); padding: 6px 6px 6px 14px; border-radius: 22px; align-items: center; }
        .liquid-tray input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; }
        .send-circle { background: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; color: #000; }

        @keyframes bubblePop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Aura Mobile</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8e8e93; font-weight: 500;">
            <span>Engine Active</span><div class="status-dot"></div>
        </div>
    </header>

    <div id="chat-canvas">
        <div class="bubble aura">Welcome to Aura Mobile. The application is ready to process requests.</div>
    </div>

    <div class="input-dock-container">
        <div class="liquid-tray">
            <input type="text" id="ios-input-field" placeholder="Ask Aura...">
            <button class="send-circle" onclick="submitIosQuery()">➔</button>
        </div>
    </div>

<script>
    // 🔴 PASTE YOUR GEMINI API KEY INSIDE THE QUOTES BELOW 🔴
    const NATIVE_IOS_KEY = "AIzaSyB29UBzA8kLlBGaWFrjGh0122LBXRPBy4I";

    const box = document.getElementById('chat-canvas');

    async function submitIosQuery() {
        const input = document.getElementById('ios-input-field');
        const text = input.value.trim();
        if(!text) return;

        pushBubble('user', text);
        input.value = '';

        const pendingBubble = pushBubble('aura', "Aura is searching...");

        if(NATIVE_IOS_KEY === "AIzaSyB29UBzA8kLlBGaWFrjGh0122LBXRPBy4I" || !NATIVE_IOS_KEY) {
            pendingBubble.innerText = "Error: App configuration is incomplete. Developer key has not been injected into source structural elements.";
            return;
        }

        try {
            const apiCall = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${NATIVE_IOS_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            const data = await apiCall.json();
            pendingBubble.innerText = data.candidates[0].content.parts[0].text;
        } catch(e) {
            pendingBubble.innerText = "Connection execution failure. Please ensure backend endpoint authentication parameters are correct.";
        }
    }

    function pushBubble(role, contents) {
        const bubble = document.createElement('div');
        bubble.className = `bubble ${role}`;
        bubble.innerText = contents;
        box.appendChild(bubble);
        box.scrollTop = box.scrollHeight;
        return bubble;
    }

    document.getElementById('ios-input-field').addEventListener('keydown', e => { if(e.key === 'Enter') submitIosQuery(); });
</script>
</body>
</html>
