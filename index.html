<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aura Engine</title>
    <style>
        /* --- MODERN PREMIUM DARK VARIABLE MATRIX --- */
        :root {
            --bg: #131314;
            --surface: #1e1f20;
            --surface-variant: #282a2c;
            --border: #3c4043;
            --accent: #1a73e8;
            --accent-glow: rgba(26, 115, 232, 0.15);
            --text-main: #e3e3e3;
            --text-sub: #9aa0a6;
            --text-bright: #ffffff;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* --- STAGE MODAL GATEWAYS --- */
        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            background: var(--bg);
            transition: opacity 0.25s ease, visibility 0.25s;
        }

        .stage.hidden {
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        /* --- AUTHENTICATION CARDS --- */
        #login-stage {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 32px 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-bright);
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }
